<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alke Wallet — Ingresar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <main class="app-main">
    <section class="view">
      <div class="auth-wrap">
        <div class="text-center mb-3">
          <div class="brand-mark mx-auto mb-3" style="width:52px;height:52px;border-radius:16px;"></div>
          <h1 class="auth-title">Bienvenida a <span class="text-gradient-inline">alkewallet</span></h1>
          <p class="small mt-2 text-frase-login">Maneja tus ingresos con claridad y confianza</p>
        </div>

        <div class="login-illustration">
          <img src="assets/img/piggy-login.png" alt="Ilustración de un chanchito alcancía con monedas y una planta">
        </div>

        <form id="form-login" class="card-glass p-4" novalidate>
          <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

          <div class="mb-3">
            <label class="form-label small" for="login-email">Correo</label>
            <div class="input-icon-group">
              <i class="bi bi-envelope-fill"></i>
              <input type="email" class="form-control" id="login-email" placeholder="tunombre@correo.com" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small" for="login-password">Contraseña</label>
            <div class="input-icon-group">
              <i class="bi bi-lock-fill"></i>
              <input type="password" class="form-control" id="login-password" placeholder="••••••••" required minlength="4">
              <button type="button" id="btn-toggle-password" class="input-icon-toggle" aria-label="Mostrar contraseña">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-gradient w-100 mb-2">Iniciar sesión</button>
          <button type="button" class="btn btn-outline-light w-100 mb-2"
                  data-bs-toggle="modal" data-bs-target="#modal-registro">
            Crear cuenta
          </button>

          <p class="text-center small mt-3 mb-0 text-frase-login"><code>isabella@alke.cl</code> / <code>1234</code></p>
        </form>
      </div>
    </section>
  </main>
</div>

<!-- Modal Crear Cuenta -->
<div class="modal fade" id="modal-registro" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-glass p-3" style="border-radius:22px;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">Crear cuenta</h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="reg-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <div class="mb-3">
          <label class="form-label small" for="reg-nombre">Nombre</label>
          <div class="input-icon-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control" id="reg-nombre"
                   placeholder="Tu nombre" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small" for="reg-email">Correo</label>
          <div class="input-icon-group">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control" id="reg-email"
                   placeholder="tunombre@correo.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small" for="reg-password">Contraseña</label>
          <div class="input-icon-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" id="reg-password"
                   placeholder="••••••••" minlength="4" required>
          </div>
        </div>

        <button type="button" id="btn-guardar-cuenta" class="btn btn-gradient w-100">
          Registrarme
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
