<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alke Wallet — Movimientos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="d-flex align-items-center justify-content-between px-3 py-3">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-mark"></div>
        <span class="brand-name">alke<strong>wallet</strong></span>
      </div>
      <button id="btn-logout" class="btn btn-sm btn-outline-light rounded-pill">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </header>

  <main class="app-main">
    <section class="view">
      <div class="container-app">

        <div class="view-topbar">
          <a href="menu.html" class="btn-back"><i class="bi bi-arrow-left"></i></a>
          <h2 class="view-title">Movimientos</h2>
          <span style="width:34px;"></span>
        </div>

        <div class="card-flat d-flex justify-content-between align-items-center mb-3 p-3">
          <div>
            <div class="small text-muted">Saldo actual</div>
            <div class="fw-bold fs-5" id="history-balance">$0</div>
          </div>
        </div>

        <ul class="nav nav-pills mb-3" id="filter-tabs">
          <li class="nav-item"><button class="nav-link active" data-filter="todos">Todos</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="deposito">Depósitos</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="retiro">Retiros</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="envio">Enviado</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="recepcion">Recibido</button></li>
        </ul>

        <div id="history-list"></div>

      </div>
    </section>
  </main>

  <nav class="app-tabbar">
    <a href="menu.html" class="tab-btn"><i class="bi bi-house-door-fill"></i></a>
    <a href="transactions.html" class="tab-btn active-tab"><i class="bi bi-clock-history"></i></a>
    <a href="sendmoney.html" class="tab-btn"><i class="bi bi-arrow-left-right"></i></a>
    <a href="deposit.html" class="tab-btn"><i class="bi bi-wallet2"></i></a>
  </nav>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
