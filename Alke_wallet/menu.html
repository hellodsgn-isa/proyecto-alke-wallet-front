<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alke Wallet — Menú</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="d-flex align-items-center justify-content-between px-3 py-3">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-mark"></div>
        <span class="brand-name">alke<strong>wallet</strong></span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="user-greeting" class="text-muted small d-none d-sm-inline"></span>
        <button id="btn-logout" class="btn btn-sm btn-outline-light rounded-pill">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="view">
      <div class="container-app">

        <div class="paycard mb-4">
          <div class="chip"></div>
          <div class="small opacity-75">Saldo disponible</div>
          <div class="paycard-amount" id="dash-balance">$0</div>
          <div class="paycard-footer">
            <span id="dash-account">•••• 0000</span>
            <span class="fw-bold">alke</span>
          </div>
        </div>

        <div class="row row-cols-3 g-2 mb-4 text-center">
          <div class="col">
            <a href="deposit.html" class="quick-btn text-decoration-none">
              <span class="quick-ico bg-green"><i class="bi bi-plus-lg"></i></span>
              <span>Depositar</span>
            </a>
          </div>
          <div class="col">
            <a href="deposit.html?retiro=1" class="quick-btn text-decoration-none">
              <span class="quick-ico bg-blue"><i class="bi bi-dash-lg"></i></span>
              <span>Retirar</span>
            </a>
          </div>
          <div class="col">
            <a href="sendmoney.html" class="quick-btn text-decoration-none">
              <span class="quick-ico bg-lav"><i class="bi bi-arrow-left-right"></i></span>
              <span>Transferir</span>
            </a>
          </div>
        </div>

        <div class="tip-box mb-4">
          <i class="bi bi-lightbulb-fill me-1"></i>
          <b>Tip del día:</b> tu alias reemplaza el número de cuenta — puedes compartirlo sin miedo, es solo un apodo.
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="section-label">Últimos movimientos</span>
          <a href="transactions.html" class="btn btn-link btn-sm text-decoration-none">Ver todo</a>
        </div>
        <div id="dash-movs-preview"></div>

      </div>
    </section>
  </main>

  <nav class="app-tabbar">
    <a href="menu.html" class="tab-btn active-tab"><i class="bi bi-house-door-fill"></i></a>
    <a href="transactions.html" class="tab-btn"><i class="bi bi-clock-history"></i></a>
    <a href="sendmoney.html" class="tab-btn"><i class="bi bi-arrow-left-right"></i></a>
    <a href="deposit.html" class="tab-btn"><i class="bi bi-wallet2"></i></a>
  </nav>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
