<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alke Wallet — Transferir</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="d-flex align-items-center justify-content-between px-3 py-3">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-mark"></div>
        <span class="brand-name">alke<strong>wallet</strong></span>
      </div>
      <button id="btn-logout" class="btn btn-sm btn-outline-light rounded-pill">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </header>

  <main class="app-main">
    <section class="view">
      <div class="container-app">

        <div class="view-topbar">
          <a href="menu.html" class="btn-back"><i class="bi bi-arrow-left"></i></a>
          <h2 class="view-title">Transferir</h2>
          <span style="width:34px;"></span>
        </div>

        <div id="flash-container"></div>

        <div class="search-wrap mb-3">
          <input type="text" class="form-control" id="contact-search" placeholder="Buscar por nombre o N° de cuenta" autocomplete="off">
          <div id="autocomplete-box" class="autocomplete-list d-none"></div>
        </div>

        <button type="button" class="btn btn-outline-light w-100 mb-4" data-bs-toggle="modal" data-bs-target="#modalAddContact">
          <i class="bi bi-person-plus-fill me-1"></i> Agregar nuevo contacto
        </button>

        <div class="section-label mb-2">Mi agenda</div>
        <div id="contacts-list"></div>

        <!-- Modal: agregar contacto -->
        <div class="modal fade" id="modalAddContact" tabindex="-1">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card-glass">
              <div class="modal-body p-4">
                <h5 class="mb-3">Agregar nuevo contacto</h5>
                <div id="add-contact-alert" class="alert alert-danger py-2 small d-none"></div>
                <form id="form-add-contact">
                  <label class="form-label small text-muted">Nombre</label>
                  <input type="text" class="form-control mb-3" id="add-contact-name" placeholder="Ej: Valentina Soto" required>
                  <label class="form-label small text-muted">Número de cuenta</label>
                  <input type="text" class="form-control mb-3" id="add-contact-account" placeholder="0000-0000-0000" required>
                  <button type="submit" class="btn btn-gradient w-100">Guardar contacto</button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal: transferir -->
        <div class="modal fade" id="modalTransfer" tabindex="-1">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card-glass">
              <div class="modal-body p-4">
                <h5 class="mb-1">Transferir a <span id="transfer-target-name">—</span></h5>
                <p class="text-muted small mb-3" id="transfer-target-sub">—</p>
                <div id="transfer-alert" class="alert alert-danger py-2 small d-none"></div>
                <label class="form-label small text-muted">Monto (CLP)</label>
                <input type="number" min="1" step="1" class="form-control form-control-lg text-center mb-3" id="transfer-amount" placeholder="$ 0">
                <label class="form-label small text-muted">Mensaje (opcional)</label>
                <input type="text" class="form-control mb-3" id="transfer-note" placeholder="Ej: pago compartido">
                <button id="btn-confirm-transfer" class="btn btn-gradient w-100">Enviar</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <nav class="app-tabbar">
    <a href="menu.html" class="tab-btn"><i class="bi bi-house-door-fill"></i></a>
    <a href="transactions.html" class="tab-btn"><i class="bi bi-clock-history"></i></a>
    <a href="sendmoney.html" class="tab-btn active-tab"><i class="bi bi-arrow-left-right"></i></a>
    <a href="deposit.html" class="tab-btn"><i class="bi bi-wallet2"></i></a>
  </nav>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/sendmoney.js"></script>
</body>
</html>
