<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alke Wallet — Depositar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="d-flex align-items-center justify-content-between px-3 py-3">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-mark"></div>
        <span class="brand-name">alke<strong>wallet</strong></span>
      </div>
      <button id="btn-logout" class="btn btn-sm btn-outline-light rounded-pill">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </header>

  <main class="app-main">
    <section class="view">
      <div class="container-app">

        <div class="view-topbar">
          <a href="menu.html" class="btn-back"><i class="bi bi-arrow-left"></i></a>
          <h2 class="view-title" id="page-title">Depositar</h2>
          <span style="width:34px;"></span>
        </div>

        <!-- Selector Depositar / Retirar (misma pantalla, dos pestañas) -->
        <ul class="nav nav-pills mb-3 justify-content-center" id="fund-tabs">
          <li class="nav-item">
            <button class="nav-link active" id="tab-deposit" data-mode="deposito">Depositar</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tab-withdraw" data-mode="retiro">Retirar</button>
          </li>
        </ul>

        <div id="flash-container"></div>

        <form id="form-fund" class="card-glass p-4 text-center">
          <div id="fund-alert" class="alert alert-danger py-2 small d-none"></div>
          <label class="form-label small text-muted" id="fund-label">Monto a depositar (CLP)</label>
          <input type="number" min="1" step="1" class="form-control form-control-lg text-center mb-1" id="fund-amount" placeholder="$ 0" required>
          <p class="text-muted small mb-3">Saldo disponible: <span id="fund-balance">$0</span></p>
          <button type="submit" class="btn btn-gradient w-100" id="fund-submit">Realizar depósito</button>
        </form>

        <div class="tip-box mt-3" id="fund-tip">
          <i class="bi bi-piggy-bank-fill me-1"></i>
          <b>¿Sabías que?</b> guardar un poquito cada semana suma más de lo que parece a fin de mes.
        </div>

      </div>
    </section>
  </main>

  <nav class="app-tabbar">
    <a href="menu.html" class="tab-btn"><i class="bi bi-house-door-fill"></i></a>
    <a href="transactions.html" class="tab-btn"><i class="bi bi-clock-history"></i></a>
    <a href="sendmoney.html" class="tab-btn"><i class="bi bi-arrow-left-right"></i></a>
    <a href="deposit.html" class="tab-btn active-tab"><i class="bi bi-wallet2"></i></a>
  </nav>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/deposit.js"></script>
</body>
</html>
